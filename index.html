    <style>
        body, html {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;

            width: 100%;
            overflow-x: hidden;

        .font-serif-italic {

        }
        
        /* Premium Noise Grain */
        .noise-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.05;
            z-index: 50;
        }

        /* Perspective utility */
        .perspective-1000 { perspective: 1000px; }

        /* Shimmer animation */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .text-shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            animation: shimmer 4s infinite linear;
        }

        /* Fluid Star Drifting & Twinkling */
        @keyframes star-drift {
          0% { transform: translate(0, 0); }
          33% { transform: translate(var(--drift-x-1), var(--drift-y-1)); }
          66% { transform: translate(var(--drift-x-2), var(--drift-y-2)); }
          100% { transform: translate(0, 0); }
        }

        @keyframes star-twinkle {
          0%, 100% { opacity: 0.1; transform: scale(0.8); }
          50% { opacity: 1; transform: scale(1.1); }
        }

        .star {
          position: absolute;
          background: white;
          border-radius: 50%;
          pointer-events: none;
          will-change: transform, opacity;
          box-shadow: 0 0 3px rgba(255, 255, 255, 0.4);
          animation: 
            star-drift var(--float-duration) ease-in-out infinite,
            star-twinkle var(--twinkle-duration) ease-in-out infinite;
          animation-delay: var(--float-delay), var(--twinkle-delay);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        /* Chromatic Aberration Simulation */
        .chromatic-hover:hover {
            text-shadow: 2px 0 0 rgba(255,0,0,0.2), -2px 0 0 rgba(0,255,255,0.2);
        }
    </style>
